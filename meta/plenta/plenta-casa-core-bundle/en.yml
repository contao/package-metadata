en:
    title: Plenta Casa - Real estate websites for Contao 5.7+
    description: >
        Plenta Casa brings your properties right into Contao. Create, filter and showcase properties for rent and sale, no third-party system needed.

        Built for real estate agents, housing companies, cooperatives and agencies.

        Built from the ground up for Contao 5.7 and Symfony 7: property listings with Live Components, filters and pagination without page reloads, detail pages with gallery, Schema.org JSON-LD for search engines and Twig templates you can easily customize.

        Open source and free. Need more? The Pro Bundle adds OpenImmo import, CSV import and export, plus saved searches so interested buyers and tenants get new listings by email automatically.

        Demo and info at plentacasa.com
