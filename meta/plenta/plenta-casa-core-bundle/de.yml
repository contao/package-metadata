de:
    title: Plenta Casa - Immobilien-Websites für Contao 5.7+
    description: >
        Plenta Casa bringt deine Immobilien direkt in Contao. Objekte zur Miete und zum Kauf anlegen, filtern und schön präsentieren, ohne Fremdsystem.

        Für Makler, Wohnungsunternehmen, Genossenschaften und Agenturen.

        Von Grund auf für Contao 5.7 und Symfony 7 entwickelt: Objektlisten mit Live Components, Filter und Pagination ohne Seitenreload, Detailseiten mit Galerie, Schema.org für Suchmaschinen und Twig-Templates, die du leicht anpassen kannst.

        Open Source und kostenlos. Du brauchst mehr? Das Pro Bundle bringt OpenImmo-Import, CSV-Import und -Export sowie Suchabos, damit Interessenten neue Objekte automatisch per E-Mail bekommen.

        Demo und Infos auf plentacasa.com
