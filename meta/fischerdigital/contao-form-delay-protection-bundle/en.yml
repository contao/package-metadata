en:
    title: Form Delay Protection
    description: >
        Multi-layered spam protection for Contao forms: time-based minimum
        delay using HMAC-signed timestamps, input validation against typical
        spam patterns (regex) and optional silent drop with logging to the
        system log. Detected spam is silently discarded – including delivery
        via the Notification Center. Session-independent and compatible with
        HTTP caching and AJAX forms.
    keywords:
        - spam
        - protection
        - form
        - delay
        - hmac
        - regex
        - silent drop
