de:
    title: Formular-Verzögerungsschutz
    description: >
        Zeitbasierter Spam-Schutz für Contao-Formulare. Fügt eine
        Mindestverzögerung zwischen dem Laden und dem Absenden des
        Formulars hinzu, basierend auf HMAC-signierten Zeitstempeln.
        Session-unabhängig und kompatibel mit HTTP-Caching und AJAX-Formularen.
    keywords:
        - spam
        - schutz
        - formular
        - verzögerung
        - hmac
