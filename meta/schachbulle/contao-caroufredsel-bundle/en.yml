en:
    title: carouFredSel image carousel
    description: >
        Image carousel based on the jQuery plugin carouFredSel: gallery with a synchronized thumbnail bar, news ticker, full-screen background slideshow and a wrapper that turns any content elements into a carousel.

        The carousel settings (playback, transitions, sizes, navigation, pagination, touch and mouse wheel control) are managed centrally and can be reused by any number of elements and modules.

        Port of the Contao 3 extension by Dirk Klemmt for Contao 4.13 and Contao 5.
    keywords:
        - carousel
        - slider
        - slideshow
        - gallery
        - newsticker
        - jQuery
    support:
        issues: https://github.com/Samson1964/contao-caroufredsel-bundle/issues
        source: https://github.com/Samson1964/contao-caroufredsel-bundle
