en:
    title: Chess puzzles
    description: >
        Chess puzzle training like on Lichess. Members and guests solve puzzles taken from real games on a board in the browser. A personal rating keeps adjusting the difficulty, and no puzzle is shown again once it has been started. Every puzzle can be rated after solving it.

        Includes a ranking of members, a list of the highest ratings ever reached and a ranking saved every month. The free Lichess puzzle collection can be imported in the back end or on the command line.
    keywords:
        - chess
        - puzzles
        - tactics
        - training
        - Lichess
        - ranking
        - leaderboard
        - Glicko
    support:
        source: https://github.com/Samson1964/contao-schachaufgaben-bundle
        issues: https://github.com/Samson1964/contao-schachaufgaben-bundle/issues
