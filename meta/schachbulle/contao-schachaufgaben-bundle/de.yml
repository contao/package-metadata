de:
    title: Schachaufgaben
    description: >
        Training mit Aufgaben aus echten Partien wie bei Lichess. Mitglieder und Gäste lösen die Aufgaben auf einem Brett im Browser. Eine eigene Wertung passt die Schwierigkeit laufend an, und keine Aufgabe wird nach dem ersten Zug ein zweites Mal gestellt. Jede Aufgabe lässt sich nach dem Lösen bewerten.

        Dazu eine Rangliste der Mitglieder, eine Liste der höchsten je erreichten Wertungen und eine Rangliste, die jeden Monat gespeichert wird. Die freie Sammlung von Lichess lässt sich im Backend oder auf der Konsole importieren.
    keywords:
        - Schach
        - Schachaufgaben
        - Taktik
        - Training
        - Lichess
        - Rangliste
        - Bestenliste
        - Glicko
    support:
        source: https://github.com/Samson1964/contao-schachaufgaben-bundle
        issues: https://github.com/Samson1964/contao-schachaufgaben-bundle/issues
