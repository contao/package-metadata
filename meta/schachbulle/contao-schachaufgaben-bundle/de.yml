de:
    title: Schachaufgaben
    description: >
        Training mit Aufgaben aus echten Partien wie bei Lichess. Mitglieder und Gäste lösen die Aufgaben auf einem Brett im Browser. Eine eigene Wertung passt die Schwierigkeit laufend an, und keine Aufgabe wird zweimal gestellt.

        Dazu eine Rangliste der Mitglieder und der Import der freien Sammlung von Lichess im Backend oder auf der Konsole.
    keywords:
        - Schach
        - Schachaufgaben
        - Taktik
        - Training
        - Lichess
        - Rangliste
        - Glicko
    support:
        source: https://github.com/Samson1964/contao-schachaufgaben-bundle
        issues: https://github.com/Samson1964/contao-schachaufgaben-bundle/issues
