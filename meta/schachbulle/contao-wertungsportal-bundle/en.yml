en:
    title: Wertungsportal - German chess rating lookup
    description: >
        Integrates the rating portal of the German Chess Federation (DSB) into the DSB website via its REST interface,
        replacing the older DeWIS SOAP interface.

        Front end modules are available for players, clubs, federations, tournaments and top lists.
        Clubs and players are managed in the back end.
    keywords:
        - chess
        - rating
        - DWZ
        - German Chess Federation
    support:
        issues: https://github.com/Samson1964/contao-wertungsportal-bundle/issues
        source: https://github.com/Samson1964/contao-wertungsportal-bundle
