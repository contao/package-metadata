de:
    title: 'KI Chatbot + Kostenlos + DSGVO'
    description: |
        Beantworte die Fragen deiner Besucher direkt auf deiner Website – mit einer KI, die ausschließlich deine eigenen Inhalte kennt und die verwendeten Seiten als Quelle nennt. Es gibt eine kostenlose Stufe, die Verarbeitung findet ausschließlich in Deutschland statt, und ein Vertrag nach Art. 28 DSGVO ist auf Anfrage möglich.

        So funktioniert es:

        - Erweiterung installieren: composer require bluebranch/chatbot oder über den Contao Manager
        - Auf https://chatbot.bluebranch.de registrieren und einen API-Key erstellen
        - API-Key am Startpunkt der Website hinterlegen
        - Suchindex neu aufbauen – dabei werden die Inhalte trainiert
        - Frontend-Modul einbinden: Chat-Widget, KI-Antwort über der Trefferliste der Suche oder Frage-Modul für die Startseite

        Gut zu wissen:

        - Der API-Key bleibt auf dem Server und wird nie an den Browser übertragen
        - Einzelne Seiten und ganze Bereiche kannst du von den Antworten ausnehmen
        - Ein Modul im Backend zeigt dir, was der Chatbot gelernt hat, und lässt dich Einträge wieder löschen
        - Eigenes KI-Modell, kein Training mit deinen Inhalten, keine Weitergabe an Dritte
    keywords:
        - contao
        - ki
        - chatbot
        - suche
        - assistent
        - dsgvo
        - kostenlos
        - support
        - faq
    homepage: https://chatbot.bluebranch.de/
    support:
        issues: https://github.com/BlueBranch-GmbH/chatbot-contao/issues
        docs: https://chatbot.bluebranch.de/anleitung/contao
