en:
    title: Creuva Theme
    description: >
        Creuva – create something new. Flexible theme for Contao 5.7 and Contao 6 based on the Theme Components Bundle.
        A single console command sets up the theme, page layout, modules and website root, optionally with basic pages
        or a complete demo website. Comes with 17 color schemes, the variants light, dark and editorial and a style
        switcher to try them out. Existing websites can be exported as demo templates and imported again.
    keywords:
        - Theme
        - Template
        - Layout
        - Demo
        - color scheme
        - dark mode
        - responsive
        - Contao 6
    homepage: https://contao-themes.net/theme-detail/creuva.html
    support:
        email: support@pdir.de
