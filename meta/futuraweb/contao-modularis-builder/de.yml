de:
    title: Modularis Builder
    description: >
        Füge einmalig eine HTML-Vorlage mit Platzhaltern hinzu, und Redakteure wählen sie danach als normales Inhaltselement aus und füllen nur noch die Felder aus. HTML-Kenntnisse sind dafür nicht nötig.

        Für wiederkehrende Bausteine wie Teaser, Embeds oder Karten entfällt damit die eigene Modulprogrammierung: kein eigener DCA, kein eigener Fragment-Controller, kein eigenes Twig-Template pro Baustein mehr.

        Unterstützt Text-, Bild-, Link-, Auswahl- und Checkbox-Felder inklusive voller Bildgrößen- und Lightbox-Kontrolle wie beim nativen Contao-Bildfeld, sowie einen Löschschutz für Vorlagen, die noch verwendet werden.
    keywords:
        - Platzhalter
        - Vorlage
        - Baukasten
        - HTML-Snippet
        - wiederverwendbar
