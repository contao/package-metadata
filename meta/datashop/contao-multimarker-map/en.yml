en:
    title: Multimarker Map
    description: >
        Contao element for a map with multiple markers, using either OpenStreetMap, OpenFreeMap or Google Maps, with identical marker management in the backend.

        Each marker has a title, position and a freely editable tooltip text, plus an automatic routing link that opens the installed maps app on mobile devices and the maps website on desktop. Map color (including a grayscale mode), marker color, zoom level, provider-specific options (e.g. Google Map ID, OpenFreeMap style or custom style JSON) and further display options are configurable in the backend.
    keywords:
        - map
        - maps
        - marker
        - multimarker
        - openstreetmap
        - leaflet
        - openfreemap
        - maplibre
        - google maps
        - routing
    support:
        issues: https://github.com/datashop-cc/contao-multimarker-map/issues
        docs: https://github.com/datashop-cc/contao-multimarker-map#readme