de:
    title: Teaser-Manager
    description: >
        Verwaltet Teaser-Boxen zentral, gruppiert in Teaser-Gruppen und Kategorien. Du legst einen Inhalt einmal
        an, fasst ihn in Gruppen zusammen und spielst ihn über eine Freigabe- oder Sperrliste gezielt auf einzelnen
        Seiten aus.
    keywords:
        - Teaser
        - Box
        - Gruppe
        - Kategorie
        - Inhaltselement
