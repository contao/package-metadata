de:
    title: Trainingsplan
    description: >
        Wöchentlicher Trainingsplan für Vereine und Schulen: Wochentag, Von-Bis-Zeit und Gruppe, ohne den Umweg
        über wiederkehrende Kalendertermine. Gedacht für einen festen Wochenrhythmus, etwa im Kampfsport oder
        Fitnessbereich. Der Kalender bleibt dabei für echte Einzeltermine wie Prüfungen, Ausflüge und Lehrgänge
        zuständig.
    keywords:
        - Trainingsplan
        - Training
        - Wochenplan
        - Verein
        - Kurs
        - Gruppe
