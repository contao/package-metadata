de:
    title: Hazelchat – KI-Chatbot
    description: Fügt Ihren Hazelchat-KI-Chat-Agenten mit einem eingefügten Code auf jeder Seite ein. Er beantwortet Fragen von Besuchern aus den Seiten, die Sie freigeben, zeigt seine Quellen und leitet Anfragen weiter. Funktioniert mit Cookie-Bannern. Sie brauchen ein Hazelchat-Konto; der kostenlose Tarif gilt für eine Website.
    keywords:
        - chatbot
        - ki
        - chat
        - ki-chat-agent
        - anfragen
        - leads
        - kundenservice
    support:
        email: hello@hazelchat.co
        docs: https://hazelchat.co/de/integrations/contao/
